services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -filer -s3
    ports:
      - "127.0.0.1:8333:8333"   # API S3
      - "127.0.0.1:8888:8888"   # interface du filer
    volumes:
      - s3data:/data

  s3-init:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for b in mlflow dvc; do
      until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b
      || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b; do sleep 2; done;
      done"

  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow/
      --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
  s3data:
